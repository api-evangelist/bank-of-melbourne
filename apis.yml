apis:
- aid: bank-of-melbourne:bank-of-melbourne-cdr-product-reference-data-api
  name: Bank of Melbourne CDR Product Reference Data API
  tags:
  - CDR
  - Open Banking
  - Product Reference Data
  - Banking
  - Australia
  - Public
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.bankofmelbourne.com.au/online-services/open-banking
  baseURL: https://digital-api.bankofmelbourne.com.au/cds-au/v1/banking/products
  properties:
  - url: https://www.bankofmelbourne.com.au/online-services/open-banking
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#cdr-banking-api_get-products
    type: APIReference
  - url: openapi/bank-of-melbourne-cds-banking-products-openapi.yml
    type: OpenAPI
  description: PUBLIC, unauthenticated Consumer Data Right (CDR) Product Reference
    Data API exposing Bank of Melbourne's banking products (term deposits, credit
    and charge cards, personal loans, residential mortgages, business loans,
    leases) in machine-readable form under the Australian Consumer Data Standards.
    Confirmed live at https://digital-api.bankofmelbourne.com.au/cds-au/v1/banking/products
    (HTTP 200, x-v 5) returning a data.products array (25 per page,
    meta.totalRecords 40 confirmed 2026-07-20); a request with x-v 3 is rejected
    406 Unsupported Version. Endpoints - GET /banking/products and
    GET /banking/products/{productId}. No authorization required.
- aid: bank-of-melbourne:bank-of-melbourne-cdr-accounts-balances-api
  name: Bank of Melbourne CDR Accounts & Balances API
  tags:
  - CDR
  - Open Banking
  - Accounts
  - Balances
  - Banking
  - Australia
  - Authenticated
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.bankofmelbourne.com.au/online-services/open-banking
  baseURL: https://digital-api.bankofmelbourne.com.au/cds-au/v1/banking/accounts
  properties:
  - url: https://www.bankofmelbourne.com.au/online-services/open-banking
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#cdr-banking-api_get-accounts
    type: APIReference
  - url: openapi/bank-of-melbourne-cds-banking-products-openapi.yml
    type: OpenAPI
  description: CONSUMER-AUTHORIZED Consumer Data Right (CDR) Accounts & Balances
    surface of the shared DSB Banking API that Bank of Melbourne implements as an
    accredited CDR data holder on shared Westpac Group infrastructure. Access is
    only available to an Accredited Data Recipient (ADR) after the customer grants
    consent via the regulated CDR / OAuth2 + OpenID Connect (FAPI) authorization
    flow - it is NOT publicly callable. Covers GET /banking/accounts (list),
    GET /banking/accounts/balances (bulk balances), POST /banking/accounts/balances,
    GET /banking/accounts/{accountId}/balance, and
    GET /banking/accounts/{accountId} (account detail). Hosted under the confirmed
    CDR base https://digital-api.bankofmelbourne.com.au/cds-au/v1.
