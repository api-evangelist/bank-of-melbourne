    type: APIReference
  - url: openapi/bank-of-melbourne-cds-banking-products-openapi.yml
    type: OpenAPI
  description: CONSUMER-AUTHORIZED Consumer Data Right (CDR) Transactions surface of
    the shared DSB Banking API implemented by Bank of Melbourne as an accredited CDR
    data holder. Access requires an Accredited Data Recipient (ADR) acting under an
    active customer consent obtained through the regulated CDR OAuth2 + OpenID
    Connect (FAPI) authorization flow - it is NOT publicly callable. Covers
    GET /banking/accounts/{accountId}/transactions (with filtering/pagination) and
    GET /banking/accounts/{accountId}/transactions/{transactionId} (transaction
    detail). Hosted under the confirmed CDR base
    https://digital-api.bankofmelbourne.com.au/cds-au/v1.
