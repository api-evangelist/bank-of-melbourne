name: Bank of Melbourne
kind: company
description: Bank of Melbourne is a Victorian retail and business banking brand
  operated by Westpac Banking Corporation (ASX code WBC) as part of the Westpac
  Group. The original Bank of Melbourne was acquired by Westpac in 1997 and the
  brand was relaunched in 2011; today it operates under the St.George Bank banking
  authority within Westpac and is NOT a customer-owned mutual - it is a division
  of a publicly listed, APRA-regulated authorised deposit-taking institution
  (ADI). As an accredited Consumer Data Right (CDR) data holder, Bank of Melbourne
  exposes a public, unauthenticated Product Reference Data (PRD) API that conforms
  to the Australian Consumer Data Standards, confirmed live on shared Westpac
  Group infrastructure at digital-api.bankofmelbourne.com.au. Consumer data
  sharing runs through the regulated CDR / Accredited Data Recipient (ADR) model
  using OAuth2 / OpenID Connect (FAPI) authorization; the bank does not run a
  broader third-party developer portal.
